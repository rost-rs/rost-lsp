[package]
name = "rost-lsp"
version = "0.1.0"
edition = "2024"
authors = ["The Rost Project Contributors"]
description = "Language Server Protocol (LSP) server for the .rost declarative language"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
tower-lsp = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
utilrs = { path = "../utilrs", features = ["rost"] }
